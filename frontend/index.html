<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Balai Ilmu — asisten informasi akademik berbasis dokumen dengan studi kasus Universitas Riau, lengkap dengan sumber jawabannya." />
    <meta name="theme-color" content="#0B5D3B" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Balai Ilmu</title>
    <script>
      // Terapkan tema sebelum render supaya tidak berkedip.
      try {
        var p = JSON.parse(localStorage.getItem("unri-prefs") || "{}");
        var t = p.theme || localStorage.getItem("unri-theme") || "system";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        var size = { normal: 16, sedang: 18, besar: 20 }[p.textSize];
        if (size) document.documentElement.style.setProperty("--answer-size", size + "px");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
